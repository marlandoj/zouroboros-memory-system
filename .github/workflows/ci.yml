name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --cwd scripts --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Context MCP policy and transport tests
        run: bun test scripts/mcp-access-policy.test.ts scripts/mcp-server-context-http.test.ts
